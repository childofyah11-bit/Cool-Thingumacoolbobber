
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX OS TERMINAL</title>
    <link rel="dns-prefetch" href="https://8.8.8">
    <link rel="dns-prefetch" href="https://1.1.1">
    <link rel="preconnect" href="https://1.1.1" crossorigin>
    <style>
        body { 
            font-family: 'Courier New', Courier, monospace; 
            background-color: #030704; 
            color: #3fb950; 
            text-align: center; 
            padding: 30px; 
            margin: 0;
            background-image: linear-gradient(rgba(16, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
                              linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
        } 
        .container { 
            max-width: 750px; 
            margin: 0 auto; 
            background: #070f0a; 
            padding: 30px; 
            border: 1px solid #1f6b33; 
            box-shadow: 0 0 30px rgba(0, 255, 100, 0.15), inset 0 0 15px rgba(0,0,0,0.9);
            position: relative;
        } 
        .corner-tag {
            position: absolute;
            top: 5px;
            right: 10px;
            font-size: 10px;
            color: #1f6b33;
            letter-spacing: 3px;
        }
        h1 { 
            margin-top: 5px; 
            color: #58ff88; 
            font-size: 32px; 
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 8px rgba(88, 255, 136, 0.6);
        } 
        .subtitle {
            margin: -5px 0 30px 0; 
            font-size: 12px; 
            color: #1f6b33;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: bold;
        }
        .hud-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .hud-card {
            background: #040906;
            border: 1px solid #1f6b33;
            padding: 15px;
            text-align: left;
        }
        .hud-label {
            font-size: 11px;
            color: #1f6b33;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .status { 
            font-size: 18px; 
            color: #58ff88; 
            font-weight: bold; 
            text-transform: uppercase;
        } 
        .latency-badge { 
            font-size: 22px; 
            color: #00ffff; 
            font-weight: bold;
        } 
        .terminal-box {
            background: #020402; 
            border: 1px solid #1f6b33; 
            padding: 15px;
            text-align: left;
        }
        .log-container { 
            height: 220px; 
            overflow-y: auto; 
            font-size: 12px; 
            color: #3fb950;
            margin-bottom: 10px;
        } 
        .input-line {
            display: flex;
            align-items: center;
            font-size: 12px;
            color: #58ff88;
            border-top: 1px solid #1f6b33;
            padding-top: 10px;
        }
        .prompt-label {
            margin-right: 5px;
            white-space: pre;
        }
        .cmd-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #00ffff;
            font-family: inherit;
            font-size: inherit;
            outline: none;
        }
        .success { color: #58ff88; } 
        .info { color: #00ffff; } 
        .fail { color: #ff3333; font-weight: bold; } 
    </style>
</head>
<body>
    <div class="container"> 
        <div class="corner-tag">VIRTUAL_CORE_v5.0</div>
        <h1>Uplink Mainframe</h1> 
        <div class="subtitle">// Interactive Shell Environment //</div> 
        
        <div class="hud-grid">
            <div class="hud-card">
                <div class="hud-label">📡 System State</div>
                <div class="status" id="status-text">INITIALIZING...</div> 
            </div>
            <div class="hud-card">
                <div class="hud-label">⚡ Pulse Latency</div>
                <div class="latency-badge" id="latency-text">-- MS</div> 
            </div>
        </div>
        
        <!-- Integrated Interactive Terminal Console Container -->
        <div class="terminal-box">
            <div class="log-container" id="log-box"></div> 
            <div class="input-line">
                <span class="prompt-label">user@netcore:~#</span>
                <input type="text" id="cmd-field" class="cmd-input" placeholder="Type 'help' for available overrides..." autocomplete="off" autofocus>
            </div>
        </div>
    </div> 

    <script> 
        const logBox = document.getElementById('log-box'); 
        const statusText = document.getElementById('status-text'); 
        const latencyText = document.getElementById('latency-text'); 
        const cmdField = document.getElementById('cmd-field');

        function appendLog(message, type) { 
            requestAnimationFrame(() => { 
                const logEntry = document.createElement('div'); 
                logEntry.className = type || ''; 
                logEntry.innerHTML = message; 
                logBox.appendChild(logEntry); 
                logBox.scrollTop = logBox.scrollHeight; 
            }); 
        } 

        // Live Command Execution Handler
        cmdField.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const input = this.value.trim().toLowerCase();
                if (!input) return;
                
                appendLog(`[INPUT] user@netcore:~# ${this.value}`, 'info');
                this.value = ''; // Reset prompt input

                switch(input) {
                    case 'help':
                        appendLog(" > Sub-system commands: [status, neofetch, clear, matrix, ping]", "info");
                        break;
                    case 'status':
                        appendLog(` > Mainframe state: ${statusText.innerText} | Interval thread tracking active.`, "success");
                        break;
                    case 'clear':
                        logBox.innerHTML = '';
                        break;
                    case 'matrix':
                        appendLog(" > Wake up, Neo... The Matrix has you. Follow the white rabbit. 🖥️", "success");
                        break;
                    case 'ping':
                        appendLog(` > Direct manual interface ping echo checked: ${latencyText.innerText}`, "info");
                        break;
                    case 'neofetch':
                        appendLog(" 🖥️  <b>OS:</b> Titan Matrix Core OS v5.0<br> 📟 <b>Shell:</b> Netcore Bash emu<br> 📡 <b>Uplink:</b> Starlink Persistent Loop", "success");
                        break;
                    default:
                        appendLog(` > Command execution failure: '${input}' unrecognized by terminal architecture.`, "fail");
                }
            }
        });

        // Click wrapper to maintain keyboard target focus
        document.querySelector('.terminal-box').addEventListener('click', () => cmdField.focus());

        const worker = new Worker('./worker.js'); 
        worker.onmessage = function(e) { 
            if (e.data === 'pulse') { 
                const startTime = performance.now(); 
                fetch(`./ping.txt?t=${Date.now()}`, { cache: 'no-store' }) 
                .then(res => { 
                    if (!res.ok) throw new Error(); 
                    const latency = Math.round(performance.now() - startTime); 
                    latencyText.innerText = `${latency} MS`; 
                    statusText.innerText = "ONLINE / SECURED"; 
                    statusText.style.color = "#58ff88"; 
                }) 
                .catch(() => { 
                    statusText.innerText = "DROPPED / RETRYING"; 
                    statusText.style.color = "#ff3333"; 
                    appendLog("[ALERT] Sub-thread connection drop caught. Initializing cycle.", "fail"); 
                }); 
            } 
        }; 
        appendLog("<b>Matrix Virtual Mainframe v5.0</b> successfully booted.", "success");
        appendLog("Type <u><b>help</b></u> into the lower command line interface to input overrides.", "info");
    </script> 
</body>
</html>
