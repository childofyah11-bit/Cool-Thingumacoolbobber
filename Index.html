<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="dns-prefetch" href="https://8.8.8">
    <link rel="dns-prefetch" href="https://1.1.1">
    <link rel="preconnect" href="https://1.1.1" crossorigin>
    <style>
        body { 
            font-family: 'Impact', 'Arial Black', sans-serif; 
            background-color: #0c0d0e; 
            color: #e4e6eb; 
            text-align: center; 
            padding: 30px; 
            margin: 0;
            background-image: linear-gradient(45deg, #111 25%, transparent 25%), 
                              linear-gradient(-45deg, #111 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #111 75%), 
                              linear-gradient(-45deg, transparent 75%, #111 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        } 
        .container { 
            max-width: 700px; 
            margin: 0 auto; 
            background: #1a1c1e; 
            padding: 35px; 
            border-radius: 0px; 
            border: 4px solid #ff5500; 
            box-shadow: 0 0 25px rgba(255, 85, 0, 0.2), inset 0 0 20px rgba(0,0,0,0.8);
            position: relative;
        } 
        .container::before {
            content: "🛠️ WARP ENGINE DRIVE";
            position: absolute;
            top: -15px;
            left: 20px;
            background: #ff5500;
            color: #000;
            padding: 2px 10px;
            font-size: 12px;
            letter-spacing: 2px;
        }
        h1 { 
            margin-top: 10px; 
            color: #ffffff; 
            font-size: 42px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 3px 3px 0px #ff5500;
        } 
        .subtitle {
            margin: -5px 0 25px 0; 
            font-size: 14px; 
            color: #a0a5ad;
            font-family: monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .status { 
            font-size: 28px; 
            color: #00ff66; 
            font-weight: bold; 
            margin: 15px 0; 
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 255, 106, 0.4);
        } 
        .latency-badge { 
            font-size: 18px; 
            color: #ff5500; 
            background: #000000; 
            padding: 8px 20px; 
            border-radius: 0px; 
            display: inline-block; 
            margin-bottom: 25px; 
            border: 2px solid #ff5500; 
            font-family: monospace;
            font-weight: bold;
        } 
        .panel-box { 
            background: #111315; 
            padding: 20px; 
            border-radius: 0px; 
            margin-bottom: 20px; 
            border-left: 5px solid #ff5500;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            border-right: 1px solid #333;
            text-align: left; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        } 
        .panel-title { 
            font-size: 16px; 
            font-weight: bold; 
            color: #ffffff; 
            margin: 0; 
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: monospace;
        } 
        .audio-controls { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            font-size: 14px; 
            color: #a0a5ad;
            font-family: monospace;
        } 
        input[type="file"] { 
            font-size: 12px; 
            color: #000; 
            background: #ff5500;
            padding: 8px;
            border: none;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        } 
        input[type="range"] { 
            accent-color: #ff5500; 
            width: 100%; 
            cursor: pointer; 
            background: #222;
            height: 10px;
        } 
        audio { 
            width: 100%; 
            margin-top: 5px; 
            filter: invert(1) hue-rotate(180deg); /* Dark tactical skin for native audio player */
        } 
        .log-container { 
            text-align: left; 
            background: #050606; 
            border: 2px solid #222; 
            border-radius: 0px; 
            padding: 15px; 
            height: 160px; 
            overflow-y: auto; 
            font-family: monospace; 
            font-size: 13px; 
            color: #888; 
        } 
        .success { color: #00ff66; font-weight: bold; } 
        .info { color: #ffbc00; } 
        .fail { color: #ff1100; font-weight: bold; text-transform: uppercase; background: rgba(255,17,0,0.1); padding: 2px 5px; } 
    </style>
</head>
<body>
    <div class="container"> 
        <h1>Titan Keeper</h1> 
        <div class="subtitle"></div> 
        
        <div class="status" id="status-text">Igniting Cores...</div> 
        <div class="latency-badge" id="latency-text">PULSE: -- MS</div> 
        
        <!-- Audio Processing Panel --> 
        <div class="panel-box"> 
            <div class="panel-title">⚡ Core Audio Inhibitor (Tab Anti-Sleep)</div> 
            <div class="audio-controls"> 
                <label>Feed Heavy Asset (.mp3, .wav, .ogg):</label> 
                <input type="file" id="audio-file" accept="audio/*"> 
                <div style="display: flex; justify-content: space-between; margin-top: 5px;"> 
                    <span>THROTTLE BOOST:</span> 
                    <span id="boost-val" style="color: #ff5500; font-weight: bold;">100% (BASE)</span> 
                </div> 
                <input type="range" id="boost-slider" min="100" max="200" value="100"> 
                <audio id="media-player" controls></audio> 
            </div> 
        </div> 
        
        <div class="log-container" id="log-box"></div> 
    </div> 

    <script> 
        const logBox = document.getElementById('log-box'); 
        const statusText = document.getElementById('status-text'); 
        const latencyText = document.getElementById('latency-text'); 
        const audioFile = document.getElementById('audio-file'); 
        const mediaPlayer = document.getElementById('media-player'); 
        const boostSlider = document.getElementById('boost-slider'); 
        const boostVal = document.getElementById('boost-val'); 
        let audioCtx = null; 
        let gainNode = null; 
        let sourceNode = null; 

        function appendLog(message, type) { 
            requestAnimationFrame(() => { 
                const time = new Date().toLocaleTimeString(); 
                const logEntry = document.createElement('div'); 
                logEntry.className = type; 
                logEntry.innerHTML = `[${time}] > ${message}`; 
                logBox.appendChild(logEntry); 
                logBox.scrollTop = logBox.scrollHeight; 
            }); 
        } 

        if ('serviceWorker' in navigator) { 
            window.addEventListener('load', () => { 
                navigator.serviceWorker.register('./sw.js') 
                .then(() => appendLog("Offline system structural array online.", "success")) 
                .catch(err => appendLog(`Matrix warning: ${err.message}`, "info")); 
            }); 
        } 

        audioFile.addEventListener('change', function() { 
            const file = this.files[0]; 
            if (!file) return; 
            mediaPlayer.src = URL.createObjectURL(file); 
            appendLog(`Chamber loaded with fuel: ${file.name}`, "info"); 
            if (!audioCtx) { 
                audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
                gainNode = audioCtx.createGain(); 
                sourceNode = audioCtx.createMediaElementSource(mediaPlayer); 
                sourceNode.connect(gainNode); 
                gainNode.connect(audioCtx.destination); 
            } 
        }); 

        boostSlider.addEventListener('input', function() { 
            const multiplier = this.value / 100; 
            boostVal.innerText = `${this.value}% ${this.value > 150 ? '(OVERDRIVE)' : '(BASE)'}`; 
            if (gainNode) gainNode.gain.setValueAtTime(multiplier, audioCtx.currentTime); 
        }); 

        const worker = new Worker('./worker.js'); 
        worker.onmessage = function(e) { 
            if (e.data === 'pulse') { 
                const startTime = performance.now(); 
                fetch(`./ping.txt?t=${Date.now()}`, { cache: 'no-store' }) 
                .then(res => { 
                    if (!res.ok) throw new Error(); 
                    const latency = Math.round(performance.now() - startTime); 
                    latencyText.innerText = `PULSE: ${latency} MS`; 
                    statusText.innerText = "System Engaged & Maintaining Lock"; 
                    statusText.style.color = "#00ff66"; 
                    appendLog(`Network ping heartbeat validated successfully. (${latency}ms)`, "success"); 
                }) 
                .catch(() => { 
                    statusText.innerText = "CRITICAL: Connection Dropped / Re-routing..."; 
                    statusText.style.color = "#ff1100"; 
                    appendLog("ALERT: Sub-thread payload dropped. Attempting emergency cycle.", "fail"); 
                }); 
            } 
        }; 
        appendLog("Titan mainframe fully initialized.", "success"); 
    </script> 
</body>
</html>
