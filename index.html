<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>idk</title>
    <style>
        body { background: #0b1016; color: #33ff33; font-family: monospace; padding: 30px; }
    </style>
</head>
<body>
    <h2>BLE Hardware Discovery Engine</h2>
    <button id="scan">Scan for Bluetooth Hardware</button>
    <ul id="deviceList"></ul>

    <script>
        document.getElementById('scan').addEventListener('click', async () => {
            try {
                // Request physical Bluetooth device discovery parameters
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true
                });
                const item = document.createElement('li');
                item.innerText = `Found Device: Name = ${device.name || 'Unknown'}, ID = ${device.id}`;
                document.getElementById('deviceList').appendChild(item);
            } catch (error) {
                console.log("Discovery canceled or failed: " + error);
            }
        });
    </script>
</body>
</html>
