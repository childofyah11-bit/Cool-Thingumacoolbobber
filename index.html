<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JET SKY ARENA</title>
    <style>
        body {
            background-color: #050806;
            color: #00ff66;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 13px;
        }
        .workspace {
            display: flex;
            gap: 20px;
            background: #09120c;
            padding: 20px;
            border: 2px solid #1f6b33;
            box-shadow: 0 0 35px rgba(0, 255, 100, 0.2);
        }
        #canvas-container {
            position: relative;
            background: #010402;
            border: 1px solid #1f6b33;
        }
        canvas {
            display: block;
        }
        .matrix-panel {
            width: 280px;
            background: #040805;
            border: 1px solid #1f6b33;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }
        .panel-title {
            font-size: 13px;
            font-weight: bold;
            color: #00ffff;
            border-bottom: 1px solid #1f6b33;
            padding-bottom: 5px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .telemetry-row {
            font-size: 12px;
            color: #3fb950;
            text-align: left;
            margin-bottom: 8px;
        }
        .val { color: #00ffff; font-weight: bold; }
        .danger-val { color: #ff3333; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        ⚡ SKY ARENA // W/A/S/D to Fly Jet • Spacebar to Fire Plasma Cannons ⚡
    </div>

    <div class="workspace">
        <div id="canvas-container">
            <canvas id="game-deck" width="600" height="400"></canvas>
        </div>

        <div class="matrix-panel">
            <div class="panel-title">🛰️ SKY</div>
            <div class="telemetry-row">AIRSPACE STATE: <span class="val" id="g-state">ENGAGED</span></div>
            <div class="telemetry-row">BLUE JET HP: <span class="val" id="h-blue">100/100</span></div>
            <div class="telemetry-row">RED JET HP: <span class="danger-val" id="h-red">100/100</span></div>
            <div class="telemetry-row" style="border-top: 1px dashed #1f6b33; padding-top:8px; margin-top:8px;">
                CONFIRMED KILLS: <span class="val" style="color:#ffea00;" id="m-score">0</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-deck');
        const ctx = canvas.getContext('2d');

        // Player Jet Core Vectors (Blue)
        let playerX = 80;
        let playerY = 200;
        let playerHP = 100;
        let score = 0;
        let blueLasers = [];

        // Simplified Computer Enemy Jet Vectors (Red)
        let cpuX = 480;
        let cpuY = 200;
        let cpuHP = 100;
        let cpuMoveTimer = 0;
        let cpuTargetY = 200;
        let cpuLaserCooldown = 0;
        let redLasers = [];

        // Starfield background matrices for sense of speed
        let stars = [];
        for(let i = 0; i < 30; i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, speed: Math.random() * 3 + 1 });
        }

        // Input Trackers
        const activeKeys = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', e => { 
            let k = e.key.toLowerCase();
            if(k in activeKeys) activeKeys[k] = true; 
        });
        window.addEventListener('keyup', e => { 
            let k = e.key.toLowerCase();
            if(k in activeKeys) activeKeys[k] = false; 
            if(e.key === ' ' && playerHP > 0 && cpuHP > 0) fireBlueLaser();
        });

        function fireBlueLaser() {
            blueLasers.push({ x: playerX + 45, y: playerY, speed: 10 });
        }

        // Draws a sleek ship model built from mini shapes (triangles and booster blocks)
        function drawJet(x, y, mainColor, detailColor, isFacingLeft) {
            ctx.fillStyle = mainColor;
            let dir = isFacingLeft ? -1 : 1;

            ctx.beginPath();
            ctx.moveTo(x + (35 * dir), y);         // Nose Cone
            ctx.lineTo(x - (15 * dir), y - 12);    // Top Fuselage
            ctx.lineTo(x - (25 * dir), y - 25);    // Top Wing Tip
            ctx.lineTo(x - (20 * dir), y - 8);     // Inner Wing Top
            ctx.lineTo(x - (30 * dir), y);         // Engines Thruster
            ctx.lineTo(x - (20 * dir), y + 8);     // Inner Wing Bottom
            ctx.lineTo(x - (25 * dir), y + 25);    // Bottom Wing Tip
            ctx.lineTo(x - (15 * dir), y + 12);    // Bottom Fuselage
            ctx.closePath();
            ctx.fill();

            // Cockpit Canopy shape accent
            ctx.fillStyle = detailColor;
            ctx.beginPath();
            ctx.arc(x + (8 * dir), y, 5, 0, Math.PI * 2);
            ctx.fill();

            // Fire engine backburn sparks animation effects
            ctx.fillStyle = "#ffaa00";
            ctx.fillRect(x - (38 * dir), y - 3, 6, 6);
        }

        function gameLoop() {
            // Flight Navigation Mechanics Engine (W/A/S/D)
            if (playerHP > 0 && cpuHP > 0) {
                if (activeKeys.w && playerY > 30) playerY -= 4;
                if (activeKeys.s && playerY < canvas.height - 30) playerY += 4;
                if (activeKeys.a && playerX > 40) playerX -= 4;
                if (activeKeys.d && playerX < canvas.width / 2) playerX += 4; // Stay on left side hemisphere
            }

            // Smart Simplified AI Processing Loop
            if (playerHP > 0 && cpuHP > 0) {
                cpuMoveTimer--;
                if(cpuMoveTimer <= 0) {
                    cpuTargetY = Math.random() * (canvas.height - 100) + 50;
                    cpuMoveTimer = Math.floor(Math.random() * 30) + 20;
                }
                // Smooth glide interpolation towards target coordinate vectors
                cpuY += (cpuTargetY - cpuY) * 0.08;
                cpuX += ( (Math.sin(Date.now() / 400) * 40 + 460) - cpuX ) * 0.05;

                // Fire AI Weapon Tracker parameters
                cpuLaserCooldown--;
                if (cpuLaserCooldown <= 0) {
                    redLasers.push({ x: cpuX - 45, y: cpuY, speed: -8 });
                    cpuLaserCooldown = Math.floor(Math.random() * 35) + 25; 
                }
            }

            // Wipe view canvas frame clean
            ctx.fillStyle = "#010402";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw and drift outer tracking backdrop stars
            ctx.fillStyle = "rgba(0, 255, 100, 0.4)";
            stars.forEach(star => {
                star.x -= star.speed;
                if(star.x < 0) star.x = canvas.width;
                ctx.fillRect(star.x, star.y, 2, 2);
            });

            // Calculate weapon trajectory matrix loops (Blue lasers)
            ctx.fillStyle = "#00ffff";
            blueLasers.forEach((laser, index) => {
                laser.x += laser.speed;
                ctx.fillRect(laser.x, laser.y - 2, 20, 4);
                
                // Box intercept check on computer jet asset coordinates
                if (laser.x > cpuX - 25 && laser.x < cpuX + 25 && Math.abs(laser.y - cpuY) < 25 && cpuHP > 0) {
                    blueLasers.splice(index, 1);
                    cpuHP = Math.max(0, cpuHP - 10);
                    if (cpuHP === 0) {
                        score++;
                        document.getElementById('m-score').innerText = score;
                    }
                }
                if (laser.x > canvas.width) blueLasers.splice(index, 1);
            });

            // Calculate weapon trajectory matrix loops (Red lasers)
            ctx.fillStyle = "#ff3333";
            redLasers.forEach((laser, index) => {
                laser.x += laser.speed;
                ctx.fillRect(laser.x, laser.y - 2, 20, 4);

                // Box intercept check on user jet asset coordinates
                if (laser.x > playerX - 25 && laser.x < playerX + 25 && Math.abs(laser.y - playerY) < 25 && playerHP > 0) {
                    redLasers.splice(index, 1);
                    playerHP = Math.max(0, playerHP - 10);
                }
                if (laser.x < 0) redLasers.splice(index, 1);
            });

            // Render both high-performance craft models to interface
            if (playerHP > 0) drawJet(playerX, playerY, "#1e40af", "#00ffff", false); // Blue Interceptor
            if (cpuHP > 0) drawJet(cpuX, cpuY, "#991b1b", "#ff3333", true); // Red Computer Target

            // Broadcast data states directly out to panel labels
            document.getElementById('h-blue').innerText = `${playerHP}/100`;
            document.getElementById('h-red').innerText = `${cpuHP}/100`;

            // Terminal End State Check Overlays
            if (playerHP === 0 || cpuHP === 0) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.font = "20px 'Courier New'";
                ctx.textAlign = "center";
                
                if (cpuHP === 0) {
                    ctx.fillStyle = "#00ff66";
                    ctx.fillText("VICTORY: AIRSPACE CLEANSED", canvas.width / 2, canvas.height / 2 - 10);
                } else {
                    ctx.fillStyle = "#ff3333";
