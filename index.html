<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAPE PLATFORMER</title>
    <style>
        body {
            background-color: #050806;
            color: #00ff66;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 13px;
        }
        .workspace {
            display: flex;
            gap: 20px;
            background: #09120c;
            padding: 20px;
            border: 2px solid #1f6b33;
            box-shadow: 0 0 35px rgba(0, 255, 100, 0.2);
        }
        #canvas-container {
            position: relative;
            background: #020402;
            border: 1px solid #1f6b33;
        }
        canvas {
            display: block;
        }
        .matrix-panel {
            width: 280px;
            background: #040805;
            border: 1px solid #1f6b33;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }
        .panel-title {
            font-size: 13px;
            font-weight: bold;
            color: #00ffff;
            border-bottom: 1px solid #1f6b33;
            padding-bottom: 5px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .telemetry-row {
            font-size: 12px;
            color: #3fb950;
            text-align: left;
            margin-bottom: 8px;
        }
        .val { color: #00ffff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        ⚡ MISSION INTERCEPT // USE A / D TO STEER CHARACTER MODEL ⚡
    </div>

    <div class="workspace">
        <!-- Main Interactive Game Board Viewport -->
        <div id="canvas-container">
            <canvas id="game-deck" width="550" height="400"></canvas>
        </div>

        <!-- Telemetry Tracker Readout Windows Panel -->
        <div class="matrix-panel">
            <div class="panel-title">🛰️ ENGINE METRICS LAYER</div>
            <div class="telemetry-row">SECTOR CORES: <span class="val" id="m-cores">ONLINE</span></div>
            <div class="telemetry-row">MODEL SCALE: <span class="val">40% (SHRUNK)</span></div>
            <div class="telemetry-row">PLAYER POS_X: <span class="val" id="p-x">250</span></div>
            <div class="telemetry-row" style="border-top: 1px dashed #1f6b33; padding-top:8px; margin-top:8px;">
                TOTAL COINS: <span class="val" style="color:#ffea00;" id="m-score">0</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-deck');
        const ctx = canvas.getContext('2d');

        // Dynamic State Tracking Vectors
        let playerX = 250;
        const playerY = 270; // Positioned firmly onto the green ground deck floor strip
        const scaleFactor = 0.4; // COMPRESSION METRIC: Shrinks the character asset down to 40% size
        let score = 0;

        // Collectible Core Coordinate Points Array
        let coin = { x: 100, y: 310, active: true };

        // Keyboard Register Key Arrays
        const activeKeys = { a: false, d: false };
        window.addEventListener('keydown', e => { if(e.key.toLowerCase() in activeKeys) activeKeys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', e => { if(e.key.toLowerCase() in activeKeys) activeKeys[e.key.toLowerCase()] = false; });

        // Original Unscaled Shape Blueprint Offset Database
        const shapesBlueprint = [
            // Head Module (Centered around 200, 90)
            { type: "circle", ox: 0, oy: 0, r: 25, color: "#1e3a8a" }, // Helmet Base
            { type: "rect", ox: -15, oy: -15, w: 30, h: 12, color: "#00ffff" }, // Visor
            { type: "rect", ox: -6, oy: 8, w: 12, h: 10, color: "#475569" }, // Breather
            
            // Torso (Centered around 200, 160)
            { type: "rect", ox: -40, oy: 35, w: 80, h: 30, color: "#1e40af" }, // Chest
            { type: "rect", ox: -35, oy: 70, w: 70, h: 15, color: "#0f172a" }, // Abdomen 1
            { type: "rect", ox: -32, oy: 90, w: 64, h: 15, color: "#111827" }, // Abdomen 2
            { type: "rect", ox: -38, oy: 110, w: 76, h: 12, color: "#b45309" }, // Belt
            { type: "circle", ox: 0, oy: 116, r: 5, color: "#f59e0b" }, // Buckle

            // Left Arm Modules
            { type: "circle", ox: -50, oy: 45, r: 10, color: "#334155" }, // Shoulder
            { type: "rect", ox: -65, oy: 55, w: 14, h: 25, color: "#1d4ed8" }, // Bicep
            { type: "circle", ox: -58, oy: 85, r: 6, color: "#475569" }, // Elbow
            { type: "rect", ox: -64, oy: 93, w: 12, h: 25, color: "#1e40af" }, // Forearm
            { type: "circle", ox: -58, oy: 122, r: 5, color: "#64748b" }, // Hand

            // Right Arm Modules
            { type: "circle", ox: 50, oy: 45, r: 10, color: "#334155" }, // Shoulder
            { type: "rect", ox: 51, oy: 55, w: 14, h: 25, color: "#1d4ed8" }, // Bicep
            { type: "circle", ox: 58, oy: 85, r: 6, color: "#475569" }, // Elbow
            { type: "rect", ox: 52, oy: 93, w: 12, h: 25, color: "#1e40af" }, // Forearm
            { type: "circle", ox: 58, oy: 122, r: 5, color: "#64748b" }, // Hand

            // Left Leg Modules
            { type: "rect", ox: -35, oy: 125, w: 28, h: 15, color: "#0f172a" }, // Hip
            { type: "rect", ox: -32, oy: 145, w: 22, h: 35, color: "#1e40af" }, // Thigh
            { type: "circle", ox: -21, oy: 186, r: 7, color: "#475569" }, // Knee
            { type: "rect", ox: -31, oy: 197, w: 20, h: 40, color: "#1d4ed8" }, // Shin
            { type: "rect", ox: -39, oy: 240, w: 28, h: 12, color: "#0f172a" }, // Boot

            // Right Leg Modules
            { type: "rect", ox: 7, oy: 125, w: 28, h: 15, color: "#0f172a" }, // Hip
            { type: "rect", ox: 10, oy: 145, w: 22, h: 35, color: "#1e40af" }, // Thigh
            { type: "circle", ox: 25, oy: 186, r: 7, color: "#475569" }, // Knee
            { type: "rect", ox: 11, oy: 197, w: 20, h: 40, color: "#1d4ed8" }, // Shin
            { type: "rect", ox: 11, oy: 240, w: 28, h: 12, color: "#0f172a" } // Boot
        ];

        function respawnCoin() {
            coin.x = Math.floor(Math.random() * 480) + 35;
            coin.y = Math.floor(Math.random() * 100) + 230; // Spawns directly on reachable running channels
            coin.active = true;
        }

        function gameLoop() {
            // Player Motion Intercept Calculators
            if (activeKeys.a && playerX > 35) playerX -= 4;
            if (activeKeys.d && playerX < 515) playerX += 4;

            // Update Telemetry Metrics Readouts text
            document.getElementById('p-x').innerText = Math.round(playerX);

            // AABB Proximity Hitbox Collision Mappers (Player tracking targeting coin coordinates)
            if (coin.active && Math.abs(playerX - coin.x) < 25 && Math.abs((playerY + 50) - coin.y) < 45) {
                coin.active = false;
                score += 1;
                document.getElementById('m-score').innerText = score;
                setTimeout(respawnCoin, 400); // Deploy replacement target payload
            }

            // Clear Scene Canvas Window Views
            ctx.fillStyle = "#020402";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Level Sector Ground Platform Grid Line Strips
            ctx.fillStyle = "#1f6b33";
            ctx.fillRect(0, 340, canvas.width, 60);
            ctx.strokeStyle = "#00ff66";
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, 340); ctx.lineTo(canvas.width, 340); ctx.stroke();

            // Render Spinning Cyber Collectible Coin Target
            if (coin.active) {
                ctx.fillStyle = "#ffea00";
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#ffea00";
                ctx.beginPath();
                ctx.arc(coin.x, coin.y, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0; // Clear glowing shadow loops context profile
            }

            // COMPRESSION PIPELINE: Scale down and draw every piece of the character relative to dynamic PlayerX
            shapesBlueprint.forEach(shape => {
                ctx.fillStyle = shape.color;
                
                // Calculate scaled coordinate positions matching current vector variables
                let finalX = playerX + (shape.ox * scaleFactor);
                let finalY = playerY + (shape.oy * scaleFactor);

                if (shape.type === "circle") {
                    ctx.beginPath();
                    ctx.arc(finalX, finalY, shape.r * scaleFactor, 0, Math.PI * 2);
                    ctx.fill();
                } else if (shape.type === "rect") {
                    ctx.fillRect(finalX, finalY, shape.w * scaleFactor, shape.h * scaleFactor);
                }
            });

            requestAnimationFrame(gameLoop);
        }

        // Boot Game Logic Modules Loop Sequence
        gameLoop();
    </script>
</body>
</html>
