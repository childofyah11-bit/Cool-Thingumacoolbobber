<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER ARENA</title>
    <style>
        body {
            background-color: #050806;
            color: #00ff66;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 13px;
        }
        .workspace {
            display: flex;
            gap: 20px;
            background: #09120c;
            padding: 20px;
            border: 2px solid #1f6b33;
            box-shadow: 0 0 35px rgba(0, 255, 100, 0.2);
        }
        #canvas-container {
            position: relative;
            background: #020402;
            border: 1px solid #1f6b33;
        }
        canvas {
            display: block;
        }
        .matrix-panel {
            width: 280px;
            background: #040805;
            border: 1px solid #1f6b33;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }
        .panel-title {
            font-size: 13px;
            font-weight: bold;
            color: #00ffff;
            border-bottom: 1px solid #1f6b33;
            padding-bottom: 5px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .telemetry-row {
            font-size: 12px;
            color: #3fb950;
            text-align: left;
            margin-bottom: 8px;
        }
        .val { color: #00ffff; font-weight: bold; }
        .danger-val { color: #ff3333; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        ⚡ CYBER DUEL // A / D to Move • Spacebar to Fire Laser Blaster ⚡
    </div>

    <div class="workspace">
        <div id="canvas-container">
            <canvas id="game-deck" width="600" height="400"></canvas>
        </div>

        <div class="matrix-panel">
            <div class="panel-title">🛰️ ARENA \</div>
            <div class="telemetry-row">ARENA STATE: <span class="val" id="g-state">ENGAGED</span></div>
            <div class="telemetry-row">BLUE HP: <span class="val" id="h-blue">100/100</span></div>
            <div class="telemetry-row">RED HP: <span class="danger-val" id="h-red">100/100</span></div>
            <div class="telemetry-row" style="border-top: 1px dashed #1f6b33; padding-top:8px; margin-top:8px;">
                TOTAL WINS: <span class="val" style="color:#ffea00;" id="m-score">0</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-deck');
        const ctx = canvas.getContext('2d');

        // Scaling parameters
        const scaleFactor = 0.4;
        const groundY = 340;
        const playerY = 270;

        // Player States (Blue)
        let playerX = 100;
        let playerHP = 100;
        let score = 0;
        let blueLasers = [];

        // CPU Bot States (Red)
        let cpuX = 450;
        let cpuHP = 100;
        let cpuDirection = -1;
        let cpuLaserCooldown = 0;
        let redLasers = [];

        // Input Arrays
        const activeKeys = { a: false, d: false };
        window.addEventListener('keydown', e => { 
            if(e.key.toLowerCase() in activeKeys) activeKeys[e.key.toLowerCase()] = true; 
        });
        window.addEventListener('keyup', e => { 
            if(e.key.toLowerCase() in activeKeys) activeKeys[e.key.toLowerCase()] = false; 
            if(e.key === ' ' && playerHP > 0 && cpuHP > 0) fireBlueLaser();
        });

        // The exact geometric character sub-mesh structure blueprint layout
        const shapesBlueprint = [
            // Head Module
            { type: "circle", ox: 0, oy: 0, r: 25, isArmor: true }, 
            { type: "rect", ox: -15, oy: -15, w: 30, h: 12, isVisor: true }, 
            { type: "rect", ox: -6, oy: 8, w: 12, h: 10, isVent: true }, 
            // Torso
            { type: "rect", ox: -40, oy: 35, w: 80, h: 30, isArmor: true }, 
            { type: "rect", ox: -35, oy: 70, w: 70, h: 15, isDark: true }, 
            { type: "rect", ox: -32, oy: 90, w: 64, h: 15, isDark: true }, 
            { type: "rect", ox: -38, oy: 110, w: 76, h: 12, isBelt: true }, 
            { type: "circle", ox: 0, oy: 116, r: 5, isBuckle: true }, 
            // Left Arm
            { type: "circle", ox: -50, oy: 45, r: 10, isJoint: true }, 
            { type: "rect", ox: -65, oy: 55, w: 14, h: 25, isArmor: true }, 
            { type: "circle", ox: -58, oy: 85, r: 6, isJoint: true }, 
            { type: "rect", ox: -64, oy: 93, w: 12, h: 25, isArmor: true }, 
            { type: "circle", ox: -58, oy: 122, r: 5, isHand: true }, 
            // Right Arm
            { type: "circle", ox: 50, oy: 45, r: 10, isJoint: true }, 
            { type: "rect", ox: 51, oy: 55, w: 14, h: 25, isArmor: true }, 
            { type: "circle", ox: 58, oy: 85, r: 6, isJoint: true }, 
            { type: "rect", ox: 52, oy: 93, w: 12, h: 25, isArmor: true }, 
            { type: "circle", ox: 58, oy: 122, r: 5, isHand: true }, 
            // Left Leg
            { type: "rect", ox: -35, oy: 125, w: 28, h: 15, isDark: true }, 
            { type: "rect", ox: -32, oy: 145, w: 22, h: 35, isArmor: true }, 
            { type: "circle", ox: -21, oy: 186, r: 7, isJoint: true }, 
            { type: "rect", ox: -31, oy: 197, w: 20, h: 40, isArmor: true }, 
            { type: "rect", ox: -39, oy: 240, w: 28, h: 12, isDark: true }, 
            // Right Leg
            { type: "rect", ox: 7, oy: 125, w: 28, h: 15, isDark: true }, 
            { type: "rect", ox: 10, oy: 145, w: 22, h: 35, isArmor: true }, 
            { type: "circle", ox: 21, oy: 186, r: 7, isJoint: true }, 
            { type: "rect", ox: 11, oy: 197, w: 20, h: 40, isArmor: true }, 
            { type: "rect", ox: 11, oy: 240, w: 28, h: 12, isDark: true }
        ];

        function fireBlueLaser() {
            blueLasers.push({ x: playerX + 30, y: playerY + 25, speed: 8 });
        }

        function drawCharacter(targetX, themeColor, secondaryColor) {
            shapesBlueprint.forEach(shape => {
                if (shape.isArmor) ctx.fillStyle = themeColor;
                else if (shape.isVisor) ctx.fillStyle = secondaryColor;
                else if (shape.isVent || shape.isJoint) ctx.fillStyle = "#475569";
                else if (shape.isDark) ctx.fillStyle = "#0f172a";
                else if (shape.isBelt) ctx.fillStyle = "#b45309";
                else if (shape.isBuckle) ctx.fillStyle = "#f59e0b";
                else if (shape.isHand) ctx.fillStyle = "#64748b";

                let finalX = targetX + (shape.ox * scaleFactor);
                let finalY = playerY + (shape.oy * scaleFactor);

                if (shape.type === "circle") {
                    ctx.beginPath();
                    ctx.arc(finalX, finalY, shape.r * scaleFactor, 0, Math.PI * 2);
                    ctx.fill();
                } else if (shape.type === "rect") {
                    ctx.fillRect(finalX, finalY, shape.w * scaleFactor, shape.h * scaleFactor);
                }
            });
        }

        function gameLoop() {
            // Player Processing
            if (playerHP > 0 && cpuHP > 0) {
                if (activeKeys.a && playerX > 30) playerX -= 4;
                if (activeKeys.d && playerX < cpuX - 40) playerX += 4; // Prevent walking past CPU
            }

            // CPU Intelligence Loop (Moves, slides, and targets player)
            if (playerHP > 0 && cpuHP > 0) {
                cpuX += 1.5 * cpuDirection;
                if (cpuX > 550) cpuDirection = -1;
                if (cpuX < playerX + 60) cpuDirection = 1;

                // Fire AI Weapon System on randomized timers
                cpuLaserCooldown--;
                if (cpuLaserCooldown <= 0) {
                    redLasers.push({ x: cpuX - 30, y: playerY + 25, speed: -6 });
                    cpuLaserCooldown = Math.floor(Math.random() * 40) + 30; // Cooldown cycles
                }
            }

            // Canvas Scene Reset
            ctx.fillStyle = "#020402";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Ground Plate Setup
            ctx.fillStyle = "#1f6b33";
            ctx.fillRect(0, groundY, canvas.width, 60);
            ctx.strokeStyle = "#00ff66";
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(canvas.width, groundY); ctx.stroke();

            // Run Weapon Laser Engine Calculations (Blue)
            ctx.fillStyle = "#00ffff";
            blueLasers.forEach((laser, index) => {
                laser.x += laser.speed;
                ctx.fillRect(laser.x, laser.y, 15, 4);
                
                // Collision check on Enemy Robot hitboxes
                if (laser.x > cpuX - 20 && laser.x < cpuX + 20 && cpuHP > 0) {
                    blueLasers.splice(index, 1);
                    cpuHP = Math.max(0, cpuHP - 10);
                    if (cpuHP === 0) {
                        score++;
                        document.getElementById('m-score').innerText = score;
                    }
                }
                if (laser.x > canvas.width) blueLasers.splice(index, 1);
            });

            // Run Weapon Laser Engine Calculations (Red)
            ctx.fillStyle = "#ff3333";
            redLasers.forEach((laser, index) => {
                laser.x += laser.speed;
                ctx.fillRect(laser.x, laser.y, 15, 4);

                // Collision check on Player hitboxes
