<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITAN STRATEGO COMPANION</title>
    <style>
        body {
            background-color: #050806;
            color: #00ff66;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 13px;
        }
        .workspace {
            display: flex;
            gap: 20px;
            background: #09120c;
            padding: 20px;
            border: 2px solid #1f6b33;
            box-shadow: 0 0 35px rgba(0, 255, 100, 0.2);
        }
        #board {
            display: grid;
            grid-template-columns: repeat(10, 40px);
            grid-template-rows: repeat(10, 40px);
            gap: 2px;
            background: #111;
            padding: 4px;
            border: 1px solid #1f6b33;
        }
        .cell {
            width: 40px;
            height: 40px;
            background: #020402;
            border: 1px solid #143d1e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
        }
        .cell:hover { background: #0c1a0f; }
        .lake { background: #1d4ed8 !important; cursor: not-allowed; }
        .blue-piece { color: #00ffff; background: #1e3a8a; border-radius: 4px; }
        .red-piece { color: #ff3333; background: #7f1d1d; border-radius: 4px; }
        .selected { border: 2px solid #00ff66 !important; background: #143d1e; }
        .matrix-panel {
            width: 280px;
            background: #040805;
            border: 1px solid #1f6b33;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }
        .panel-title {
            font-size: 13px;
            font-weight: bold;
            color: #00ffff;
            border-bottom: 1px solid #1f6b33;
            padding-bottom: 5px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .telemetry-row {
            font-size: 12px;
            color: #3fb950;
            text-align: left;
            margin-bottom: 8px;
        }
        .val { color: #00ffff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        ⚡ STRATEGO DUEL // Click your Blue piece, then click an adjacent square to move ⚡
    </div>

    <div class="workspace">
        <!-- 10x10 Battlefield Grid System -->
        <div id="board"></div>

        <!-- System Intelligence Feed Panel -->
        <div class="matrix-panel">
            <div class="panel-title">🛰️ BATTLE LOG CONSOLE</div>
            <div class="telemetry-row">TURN TRACKER: <span class="val" id="turn-txt">YOUR TURN</span></div>
            <div class="telemetry-row" style="border-top: 1px dashed #1f6b33; padding-top:8px; margin-top:8px; height: 260px; overflow-y: auto;" id="log-box">
                [SYSTEM]: Game initialized.<br>Capture the hidden Red Flag (F) to win!
            </div>
        </div>
    </div>

    <script>
        const boardElement = document.getElementById('board');
        const logBox = document.getElementById('log-box');
        const turnTxt = document.getElementById('turn-txt');

        let grid = Array(10).fill(null).map(() => Array(10).fill(null));
        let selectedPiece = null;
        let isPlayerTurn = true;

        // Two lakes in the middle of the board where pieces cannot move
        const lakes = [
            {r:4, c:2}, {r:4, c:3}, {r:5, c:2}, {r:5, c:3},
            {r:4, c:6}, {r:4, c:7}, {r:5, c:6}, {r:5, c:7}
        ];

        function isLake(r, c) {
            return lakes.some(l => l.r === r && l.c === c);
        }

        function appendLog(msg) {
            logBox.innerHTML += `<br>> ${msg}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // Setup pieces: B=Bomb, F=Flag, numbers 1-9 are army strengths
        function initGame() {
            // Setup Red AI Pieces on rows 0-1 (Hidden values)
            const redPool = ["F", "B", "B", "1", "2", "3", "4", "5", "8", "9"];
            let idx = 0;
            for(let r=0; r<2; r++) {
                for(let c=0; c<5; c++) {
                    grid[r][c] = { team: 'red', value: redPool[idx++] };
                }
            }

            // Setup Blue Player Pieces on rows 8-9 (Visible values)
            const bluePool = ["F", "B", "B", "1", "2", "3", "4", "5", "8", "9"];
            idx = 0;
            for(let r=8; r<10; r++) {
                for(let c=0; c<5; c++) {
                    grid[r][c] = { team: 'blue', value: bluePool[idx++] };
                }
            }

            renderBoard();
        }

        function renderBoard() {
            boardElement.innerHTML = '';
            for (let r = 0; r < 10; r++) {
                for (let c = 0; c < 10; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    if (isLake(r, c)) {
                        cell.classList.add('lake');
                    } else {
                        const piece = grid[r][c];
                        if (piece) {
                            if (piece.team === 'blue') {
                                cell.classList.add('blue-piece');
                                cell.innerText = piece.value;
                            } else {
                                cell.classList.add('red-piece');
                                cell.innerText = '?'; // AI pieces remain completely hidden
                            }
                        }
                    }

                    if (selectedPiece && selectedPiece.r === r && selectedPiece.c === c) {
                        cell.classList.add('selected');
                    }

                    cell.addEventListener('click', () => handleCellClick(r, c));
                    boardElement.appendChild(cell);
                }
            }
        }

        function handleCellClick(r, c) {
            if (!isPlayerTurn) return;

            const piece = grid[r][c];

            // Select a blue piece
            if (piece && piece.team === 'blue') {
                if (piece.value === 'F' || piece.value === 'B') {
                    appendLog("Flags and Bombs cannot move!");
                    return;
                }
                selectedPiece = { r, c };
                renderBoard();
                return;
            }

            // If a piece is already selected, try to move it to the clicked cell
            if (selectedPiece) {
                const dr = Math.abs(r - selectedPiece.r);
                const dc = Math.abs(c - selectedPiece.c);

                // Move rule check: Must be exactly 1 block away sideways or vertically
                if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
                    if (isLake(r, c)) return;

                    const movingPiece = grid[selectedPiece.r][selectedPiece.c];
                    
                    if (!piece) {
                        // Move to empty space
                        grid[r][c] = movingPiece;
                        grid[selectedPiece.r][selectedPiece.c] = null;
                        appendLog(`Moved piece to square [${r}, ${c}]`);
                        selectedPiece = null;
                        endTurn();
                    } else if (piece.team === 'red') {
                        // Battle Engagement Rule Processors
                        handleBattle(selectedPiece.r, selectedPiece.c, r, c);
                        selectedPiece = null;
                        endTurn();
                    }
                }
            }
        }

        function handleBattle(pRow, pCol, eRow, eCol) {
            const blue = grid[pRow][pCol];
            const red = grid[eRow][eCol];

            appendLog(`ENGAGEMENT! Blue ${blue.value} vs Red ${red.value}`);

            if (red.value === 'F') {
                appendLog("VICTORY! You captured the Enemy Flag!");
                grid[eRow][eCol] = blue;
                grid[pRow][pCol] = null;
                isPlayerTurn = false;
                turnTxt.innerText = "YOU WIN!";
                renderBoard();
                return;
            }

            if (red.value === 'B') {
                appendLog("EXPLOSION! Blue hit a Bomb and died.");
                grid[pRow][pCol] = null;
                renderBoard();
                return;
            }

            // Basic number rank comparisons
            const bRank = parseInt(blue.value);
            const rRank = parseInt(red.value);

            if (bRank > rRank) {
                appendLog(`Blue wins! Red ${red.value} destroyed.`);
                grid[eRow][eCol] = blue;
                grid[pRow][pCol] = null;
            } else if (bRank < rRank) {
                appendLog(`Red wins! Blue ${blue.value} destroyed.`);
                grid[pRow][pCol] = null;
            } else {
                appendLog("Tie score! Both assets destroyed.");
                grid[pRow][pCol] = null;
                grid[eRow][eCol] = null;
            }
            renderBoard();
        }

        function endTurn() {
            isPlayerTurn = false;
            turnTxt.innerText = "COMPUTER TURN";
            setTimeout(runComputerAI, 1000);
        }

        // Basic AI tracking logic loop
