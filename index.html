<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tERMINAL</title>
    <link rel="dns-prefetch" href="https://8.8.8">
    <link rel="dns-prefetch" href="https://1.1.1">
    <link rel="preconnect" href="https://1.1.1" crossorigin>
    <style>
        body { 
            font-family: 'Courier New', Courier, monospace; 
            background-color: #030704; 
            color: #3fb950; 
            text-align: center; 
            padding: 30px; 
            margin: 0;
            /* Cyberpunk scanline effect overlay */
            background-image: linear-gradient(rgba(16, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
                              linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
        } 
        .container { 
            max-width: 750px; 
            margin: 0 auto; 
            background: #070f0a; 
            padding: 30px; 
            border: 1px solid #1f6b33; 
            box-shadow: 0 0 30px rgba(0, 255, 100, 0.15), inset 0 0 15px rgba(0,0,0,0.9);
            position: relative;
        } 
        .corner-tag {
            position: absolute;
            top: 5px;
            right: 10px;
            font-size: 10px;
            color: #1f6b33;
            letter-spacing: 3px;
        }
        h1 { 
            margin-top: 5px; 
            color: #58ff88; 
            font-size: 32px; 
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 8px rgba(88, 255, 136, 0.6);
        } 
        .subtitle {
            margin: -5px 0 30px 0; 
            font-size: 12px; 
            color: #1f6b33;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: bold;
        }
        .hud-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .hud-card {
            background: #040906;
            border: 1px dashed #1f6b33;
            padding: 15px;
            text-align: left;
        }
        .hud-label {
            font-size: 11px;
            color: #1f6b33;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .status { 
            font-size: 18px; 
            color: #58ff88; 
            font-weight: bold; 
            text-transform: uppercase;
            text-shadow: 0 0 5px rgba(0, 255, 106, 0.4);
        } 
        .latency-badge { 
            font-size: 22px; 
            color: #00ffff; 
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
        } 
        .terminal-header {
            text-align: left;
            font-size: 12px;
            color: #1f6b33;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .log-container { 
            text-align: left; 
            background: #020402; 
            border: 1px solid #1f6b33; 
            padding: 15px; 
            height: 250px; 
            overflow-y: auto; 
            font-size: 12px; 
            color: #3fb950;
            box-shadow: inset 0 0 10px rgba(0,0,0,1);
        } 
        .success { color: #58ff88; } 
        .info { color: #00ffff; } 
        .fail { color: #ff3333; font-weight: bold; background: rgba(255,50,50,0.1); padding: 0 3px; animation: blink 1s infinite; } 
        
        @keyframes blink {
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container"> 
        <div class="corner-tag">SECURE_NODE_v4.2</div>
        <h1>Uplink Mainframe</h1> 
        <div class="subtitle">// Network Persistence Matrix //</div> 
        
        <!-- Streamlined Performance HUD Grid -->
        <div class="hud-grid">
            <div class="hud-card">
                <div class="hud-label">📡 System State</div>
                <div class="status" id="status-text">INITIALIZING...</div> 
            </div>
            <div class="hud-card">
                <div class="hud-label">⚡ Pulse Latency</div>
                <div class="latency-badge" id="latency-text">-- MS</div> 
            </div>
        </div>
        
        <!-- Persistent Live Output Terminal at the Bottom --> 
        <div class="terminal-header">⚙️ LIVE MATRIX DATA INGEST:</div>
        <div class="log-container" id="log-box"></div> 
    </div> 

    <script> 
        const logBox = document.getElementById('log-box'); 
        const statusText = document.getElementById('status-text'); 
        const latencyText = document.getElementById('latency-text'); 

        function appendLog(message, type) { 
            requestAnimationFrame(() => { 
                const time = new Date().toLocaleTimeString(); 
                const logEntry = document.createElement('div'); 
                logEntry.className = type; 
                logEntry.innerHTML = `[${time}] user@netcore:~# ${message}`; 
                logBox.appendChild(logEntry); 
                logBox.scrollTop = logBox.scrollHeight; 
            }); 
        } 

        if ('serviceWorker' in navigator) { 
            window.addEventListener('load', () => { 
                navigator.serviceWorker.register('./sw.js') 
                .then(() => appendLog("Offline validation pipelines active.", "success")) 
                .catch(err => appendLog(`Core mismatch: ${err.message}`, "info")); 
            }); 
        } 

        const worker = new Worker('./worker.js'); 
        worker.onmessage = function(e) { 
            if (e.data === 'pulse') { 
                const startTime = performance.now(); 
                fetch(`./ping.txt?t=${Date.now()}`, { cache: 'no-store' }) 
                .then(res => { 
                    if (!res.ok) throw new Error(); 
                    const latency = Math.round(performance.now() - startTime); 
                    latencyText.innerText = `${latency} MS`; 
                    statusText.innerText = "ONLINE / SECURED"; 
                    statusText.style.color = "#58ff88"; 
                    appendLog(`Network intercept stable. Sync payload verified at ${latency}ms.`, "success"); 
                }) 
                .catch(() => { 
                    statusText.innerText = "DROPPED / RETRYING"; 
                    statusText.style.color = "#ff3333"; 
                    appendLog("ALERT: Network drop detected. Rerouting intercept protocols.", "fail"); 
                }); 
            } 
        }; 
        appendLog("Matrix background loop active and monitoring.", "success"); 
    </script> 
</body>
</html>
