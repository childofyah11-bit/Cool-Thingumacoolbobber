<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAPE COMPOSER</title>
    <style>
        body {
            background-color: #050806;
            color: #00ff66;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 13px;
        }
        .workspace {
            display: flex;
            gap: 20px;
            background: #09120c;
            padding: 20px;
            border: 2px solid #1f6b33;
            box-shadow: 0 0 35px rgba(0, 255, 100, 0.2);
        }
        #canvas-container {
            position: relative;
            background: #020402;
            border: 1px solid #1f6b33;
        }
        canvas {
            display: block;
        }
        .matrix-panel {
            width: 320px;
            background: #040805;
            border: 1px solid #1f6b33;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }
        .panel-title {
            font-size: 14px;
            font-weight: bold;
            color: #00ffff;
            border-bottom: 1px solid #1f6b33;
            padding-bottom: 5px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .shape-log {
            flex: 1;
            overflow-y: auto;
            font-size: 11px;
            color: #3fb950;
            text-align: left;
            white-space: pre-wrap;
            height: 340px;
        }
        .success { color: #58ff88; }
        .info { color: #00ffff; }
    </style>
</head>
<body>

    <div class="header">
        ⚡ TITAN SHAPE ASSEMBLER v9.0 // Rendering Sub-Mesh Polygons ⚡
    </div>

    <div class="workspace">
        <!-- Left: The Visual Display Canvas -->
        <div id="canvas-container">
            <canvas id="render-deck" width="400" height="400"></canvas>
        </div>

        <!-- Right: Real-time Shape Telemetry Matrix Log -->
        <div class="matrix-panel">
            <div class="panel-title">📊 SHAPE TELEMETRY MATRIX</div>
            <div id="shape-log-box" class="shape-log">Initializing data coordinates...</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('render-deck');
        const ctx = canvas.getContext('2d');
        const logBox = document.getElementById('shape-log-box');

        // Master Database holding every tiny shape coordinate that forms the character
        const characterBlueprint = [
            // HEAD MODULES
            { name: "Helmet Base", type: "circle", x: 200, y: 90, r: 25, color: "#1e3a8a" },
            { name: "Visor Frame", type: "rect", x: 185, y: 75, w: 30, h: 12, color: "#00ffff" },
            { name: "Breather Vent", type: "rect", x: 194, y: 98, w: 12, h: 10, color: "#475569" },
            
            // TORSO CORE MODULES
            { name: "Upper Chest Plate", type: "rect", x: 160, y: 125, w: 80, h: 30, color: "#1e40af" },
            { name: "Abdomen Segment 1", type: "rect", x: 165, y: 160, w: 70, h: 15, color: "#0f172a" },
            { name: "Abdomen Segment 2", type: "rect", x: 168, y: 180, w: 64, h: 15, color: "#111827" },
            { name: "Utility Belt Core", type: "rect", x: 162, y: 200, w: 76, h: 12, color: "#b45309" },
            { name: "Belt Buckle Accent", type: "circle", x: 200, y: 206, r: 5, color: "#f59e0b" },

            // LEFT ARM SUB-MESH
            { name: "L Shoulder Joint", type: "circle", x: 150, y: 135, r: 10, color: "#334155" },
            { name: "L Bicep Armor", type: "rect", x: 135, y: 145, w: 14, h: 25, color: "#1d4ed8" },
            { name: "L Elbow Protector", type: "circle", x: 142, y: 175, r: 6, color: "#475569" },
            { name: "L Forearm Gauntlet", type: "rect", x: 136, y: 183, w: 12, h: 25, color: "#1e40af" },
            { name: "L Hand Block", type: "circle", x: 142, y: 212, r: 5, color: "#64748b" },

            // RIGHT ARM SUB-MESH
            { name: "R Shoulder Joint", type: "circle", x: 250, y: 135, r: 10, color: "#334155" },
            { name: "R Bicep Armor", type: "rect", x: 251, y: 145, w: 14, h: 25, color: "#1d4ed8" },
            { name: "R Elbow Protector", type: "circle", x: 258, y: 175, r: 6, color: "#475569" },
            { name: "R Forearm Gauntlet", type: "rect", x: 252, y: 183, w: 12, h: 25, color: "#1e40af" },
            { name: "R Hand Block", type: "circle", x: 258, y: 212, r: 5, color: "#64748b" },

            // LEFT LEG SUB-MESH
            { name: "L Hip Joint Assembly", type: "rect", x: 165, y: 215, w: 28, h: 15, color: "#0f172a" },
            { name: "L Thigh Guard Plate", type: "rect", x: 168, y: 235, w: 22, h: 35, color: "#1e40af" },
            { name: "L Knee Cap Guard", type: "circle", x: 179, y: 276, r: 7, color: "#475569" },
            { name: "L Shin Greave Armor", type: "rect", x: 169, y: 287, w: 20, h: 40, color: "#1d4ed8" },
            { name: "L Heavy Combat Boot", type: "rect", x: 161, y: 330, w: 28, h: 12, color: "#0f172a" },

            // RIGHT LEG SUB-MESH
            { name: "R Hip Joint Assembly", type: "rect", x: 207, y: 215, w: 28, h: 15, color: "#0f172a" },
            { name: "R Thigh Guard Plate", type: "rect", x: 210, y: 235, w: 22, h: 35, color: "#1e40af" },
            { name: "R Knee Cap Guard", type: "circle", x: 221, y: 276, r: 7, color: "#475569" },
            { name: "R Shin Greave Armor", type: "rect", x: 211, y: 287, w: 20, h: 40, color: "#1d4ed8" },
            { name: "R Heavy Combat Boot", type: "rect", x: 211, y: 330, w: 28, h: 12, color: "#0f172a" }
        ];

        function renderWorkspace() {
            // Draw a technical radar grid map background style
            ctx.fillStyle = "#020503";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = "rgba(0, 255, 100, 0.08)";
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 20) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            logBox.innerHTML = ""; // Reset readout text telemetry window panel block

            // Loop through and stack each individual little geometric node layer
            characterBlueprint.forEach((shape) => {
                ctx.fillStyle = shape.color;
                
                if (shape.type === "circle") {
                    ctx.beginPath();
                    ctx.arc(shape.x, shape.y, shape.r, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Push vector tracking parameters to console view side-deck panel
                    logBox.innerHTML += `<span class="success">[ARC]</span> ${shape.name.padEnd(20)} => X:${shape.x} Y:${shape.y} R:${shape.r}\n`;
                } 
                else if (shape.type === "rect") {
                    ctx.fillRect(shape.x, shape.y, shape.w, shape.h);
                    
                    // Push vector tracking parameters to console view side-deck panel
                    logBox.innerHTML += `<span class="info">[BOX]</span> ${shape.name.padEnd(20)} => X:${shape.x} Y:${shape.y} W:${shape.w} H:${shape.h}\n`;
                }
            });
        }

        // Initialize Render Engine
        renderWorkspace();
    </script>
</body>
</html>
