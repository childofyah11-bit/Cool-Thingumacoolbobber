<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER STRATEGO</title>
    <style>
        body {
            background-color: #050806;
            color: #00ff66;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 13px;
        }
        .workspace {
            display: flex;
            gap: 20px;
            background: #09120c;
            padding: 20px;
            border: 2px solid #1f6b33;
            box-shadow: 0 0 35px rgba(0, 255, 100, 0.2);
        }
        #board {
            display: grid;
            grid-template-columns: repeat(6, 55px);
            grid-template-rows: repeat(6, 55px);
            gap: 4px;
            background: #020402;
            padding: 6px;
            border: 1px solid #1f6b33;
        }
        .cell {
            width: 55px;
            height: 55px;
            background: #040805;
            border: 1px solid #143d1e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            user-select: none;
            box-sizing: border-box;
        }
        .cell:hover { background: #0c1a0f; }
        .blue-piece { color: #00ffff; background: #1e3a8a; border: 1px solid #00ffff; border-radius: 4px; }
        .red-piece { color: #ff3333; background: #7f1d1d; border: 1px solid #ff3333; border-radius: 4px; }
        .selected { border: 2px solid #00ff66 !important; background: #143d1e; }
        .matrix-panel {
            width: 280px;
            background: #040805;
            border: 1px solid #1f6b33;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }
        .panel-title {
            font-size: 13px;
            font-weight: bold;
            color: #00ffff;
            border-bottom: 1px solid #1f6b33;
            padding-bottom: 5px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .telemetry-row {
            font-size: 12px;
            color: #3fb950;
            text-align: left;
            margin-bottom: 8px;
        }
        .val { color: #00ffff; font-weight: bold; }
        #log-box {
            border-top: 1px dashed #1f6b33;
            padding-top: 8px;
            margin-top: 8px;
            height: 240px;
            overflow-y: auto;
            font-size: 11px;
            text-align: left;
            line-height: 18px;
        }
    </style>
</head>
<body>

    <div class="header">
        ⚡ STRATEGO DECK // Click a Blue piece, then click a neighboring square to move or attack ⚡
    </div>

    <div class="workspace">
        <!-- 6x6 Battle Grid -->
        <div id="board"></div>

        <!-- Right Side Console Metrics HUD -->
        <div class="matrix-panel">
            <div class="panel-title">🛰️ BATTLE LOG CONSOLE</div>
            <div class="telemetry-row">TURN TRACKER: <span class="val" id="turn-txt">YOUR TURN</span></div>
            <div id="log-box">
                [SYSTEM]: Matrix initialised clean.<br>Attack hidden Red targets (?) to track the Flag!
            </div>
        </div>
    </div>

    <script>
        const boardElement = document.getElementById('board');
        const logBox = document.getElementById('log-box');
        const turnTxt = document.getElementById('turn-txt');

        // Create clean 6x6 memory map grid array tracking arrays
        let grid = [
            [null, null, null, null, null, null],
            [null, null, null, null, null, null],
            [null, null, null, null, null, null],
            [null, null, null, null, null, null],
            [null, null, null, null, null, null],
            [null, null, null, null, null, null]
        ];

        let selectedPiece = null;
        let isPlayerTurn = true;

        function appendLog(msg) {
            logBox.innerHTML += `<br>> ${msg}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function initGame() {
            // Setup Red Computer Units on top row (Row 0)
            const redPool = ["F", "B", "5", "4", "3", "2"];
            for (let c = 0; c < 6; c++) {
                grid[0][c] = { team: 'red', value: redPool[c] };
            }

            // Setup Blue Player Units on bottom row (Row 5)
            const bluePool = ["F", "B", "5", "4", "3", "2"];
            for (let c = 0; c < 6; c++) {
                grid[5][c] = { team: 'blue', value: bluePool[c] };
            }

            renderBoard();
        }

        function renderBoard() {
            boardElement.innerHTML = '';
            for (let r = 0; r < 6; r++) {
                for (let c = 0; c < 6; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    const piece = grid[r][c];
                    if (piece) {
                        if (piece.team === 'blue') {
                            cell.classList.add('blue-piece');
                            cell.innerHTML = `<span style="font-size:10px; opacity:0.6;">BLUE</span><br>${piece.value}`;
                        } else {
                            cell.classList.add('red-piece');
                            cell.innerHTML = `<span style="font-size:10px; opacity:0.6;">RED</span><br>?`; // Hidden from viewer
                        }
                    }

                    // Highlight selected piece
                    if (selectedPiece && selectedPiece.r === r && selectedPiece.c === c) {
                        cell.classList.add('selected');
                    }

                    cell.addEventListener('click', () => handleCellClick(r, c));
                    boardElement.appendChild(cell);
                }
            }
        }

        function handleCellClick(r, c) {
            if (!isPlayerTurn) return;

            const piece = grid[r][c];

            // Hook and select an player item
            if (piece && piece.team === 'blue') {
                if (piece.value === 'F' || piece.value === 'B') {
                    appendLog("Flags and Bombs cannot move!");
                    return;
                }
                selectedPiece = { r, c };
                renderBoard();
                return;
            }

            // Move or combat processing trigger path rules
            if (selectedPiece) {
                const dr = Math.abs(r - selectedPiece.r);
                const dc = Math.abs(c - selectedPiece.c);

                // Step limitation logic constraint validation
                if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
                    const movingPiece = grid[selectedPiece.r][selectedPiece.c];

                    if (!piece) {
                        // Empty slot navigation movement routing
                        grid[r][c] = movingPiece;
                        grid[selectedPiece.r][selectedPiece.c] = null;
                        appendLog(`Moved piece to [Row:${r}, Col:${c}]`);
                        selectedPiece = null;
                        endTurn();
                    } else if (piece.team === 'red') {
                        // Battle evaluation handling pipeline
                        handleBattle(selectedPiece.r, selectedPiece.c, r, c);
                        selectedPiece = null;
                        endTurn();
                    }
                }
            }
        }

        function handleBattle(pRow, pCol, eRow, eCol) {
            const blue = grid[pRow][pCol];
            const red = grid[eRow][eCol];

            appendLog(`COMBAT: Blue ${blue.value} attacks Red (${red.value})`);

            if (red.value === 'F') {
                appendLog("VICTORY! Enemy Flag captured!");
                grid[eRow][eCol] = blue;
                grid[pRow][pCol] = null;
                isPlayerTurn = false;
                turnTxt.innerText = "WINNER!";
                renderBoard();
                return;
            }

            if (red.value === 'B') {
                appendLog("BOOM! Blue hit a Bomb and is vaporised.");
                grid[pRow][pCol] = null;
                renderBoard();
                return;
            }

            const bRank = parseInt(blue.value);
            const rRank = parseInt(red.value);

            if (bRank > rRank) {
                appendLog(`Blue wins! Red Rank ${red.value} destroyed.`);
                grid[eRow][eCol] = blue;
                grid[pRow][pCol] = null;
            } else if (bRank < rRank) {
                appendLog(`Red wins! Blue Rank ${blue.value} destroyed.`);
                grid[pRow][pCol] = null;
            } else {
                appendLog("Stalemate! Both items eliminated.");
                grid[pRow][pCol] = null;
                grid[eRow][eCol] = null;
            }
            renderBoard();
        }

        function endTurn() {
            isPlayerTurn = false;
            turnTxt.innerText = "COMPUTER TURN";
            setTimeout(runComputerAI, 800);
        }

        function runComputerAI() {
            let legalMoves = [];

            // Scan board allocations for valid machine paths
            for (let r = 0; r < 6; r++) {
                for (let c = 0; c < 6; c++) {
                    if (grid[r][c] && grid[r][c].team === 'red' && grid[r][c].value !== 'F' && grid[r][c].value !== 'B') {
