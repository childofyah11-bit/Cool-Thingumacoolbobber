    <style>
        body { 
            font-family: 'Courier New', Courier, monospace; 
            background-color: #030704; 
            color: #3fb950; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
            background-image: linear-gradient(rgba(16, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
                              linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
        } 
        .container { 
            max-width: 850px; 
            margin: 0 auto; 
            background: #070f0a; 
            padding: 25px; 
            border: 1px solid #1f6b33; 
            box-shadow: 0 0 30px rgba(0, 255, 100, 0.15), inset 0 0 15px rgba(0,0,0,0.9);
            position: relative;
        } 
        .corner-tag {
            position: absolute;
            top: 5px;
            right: 10px;
            font-size: 10px;
            color: #1f6b33;
            letter-spacing: 2px;
        }
        h1 { 
            margin-top: 5px; 
            color: #58ff88; 
            font-size: 28px; 
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 8px rgba(88, 255, 136, 0.6);
        } 
        .subtitle {
            margin: -5px 0 20px 0; 
            font-size: 11px; 
            color: #1f6b33;
            text-transform: uppercase;
            letter-spacing: 4px;
        }
        .hud-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .hud-card {
            background: #040906;
            border: 1px solid #1f6b33;
            padding: 10px;
            text-align: left;
        }
        .hud-label {
            font-size: 10px;
            color: #1f6b33;
            text-transform: uppercase;
        }
        .status { font-size: 14px; color: #58ff88; font-weight: bold; } 
        .latency-badge { font-size: 16px; color: #00ffff; font-weight: bold; } 
        .terminal-box {
            background: #020402; 
            border: 1px solid #1f6b33; 
            padding: 15px;
            text-align: left;
        }
        .log-container { 
            height: 280px; 
            overflow-y: auto; 
            font-size: 12px; 
            color: #3fb950;
            margin-bottom: 10px;
            white-space: pre-wrap;
        } 
        .input-line {
            display: flex;
            align-items: center;
            font-size: 12px;
            color: #58ff88;
            border-top: 1px solid #1f6b33;
            padding-top: 10px;
        }
        .prompt-label { margin-right: 5px; color: #58ff88; }
        .cmd-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #00ffff;
            font-family: inherit;
            font-size: inherit;
            outline: none;
        }
        .app-window {
            background: #020503;
            border: 2px solid #00ffff;
            margin-top: 20px;
            padding: 15px;
            text-align: left;
            display: none;
        }
        .app-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #00ffff;
            padding-bottom: 5px;
            margin-bottom: 12px;
            font-weight: bold;
            color: #00ffff;
            font-size: 12px;
        }
        .close-btn { color: #ff3333; cursor: pointer; font-weight: bold; }
        .editor-textarea {
            width: 100%;
            height: 180px;
            background: #050a06;
            border: 1px solid #1f6b33;
            color: #00ff66;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            outline: none;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
        }
        .editor-actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        .action-btn {
            background: #00ffff;
            border: none;
            color: #000;
            padding: 6px 15px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
        }
        .success { color: #58ff88; } 
        .info { color: #00ffff; } 
        .fail { color: #ff3333; font-weight: bold; } 
    </style>
</head>
<body>
    <div class="container"> 
        <div class="corner-tag">IDE_KERNEL_LOADED_v7.0</div>
        <h1>Titan OS & IDE</h1> 
        <div class="subtitle">// Real-Time Script Compiler //</div> 
        
        <div class="hud-grid">
            <div class="hud-card">
                <div class="hud-label">📡 Compiler Core</div>
                <div class="status" id="status-text">ENGAGED</div> 
            </div>
            <div class="hud-card">
                <div class="hud-label">⚡ Uplink Speed</div>
                <div class="latency-badge" id="latency-text">-- MS</div> 
            </div>
            <div class="hud-card">
                <div class="hud-label">📁 Current Volume</div>
                <div class="latency-badge" id="directory-text" style="color: #ffbc00; font-size: 14px;">/root</div> 
            </div>
        </div>
        
        <div class="terminal-box">
            <div class="log-container" id="log-box"></div> 
            <div class="input-line">
                <span class="prompt-label" id="prompt-display">user@titan:/root$</span>
                <input type="text" id="cmd-field" class="cmd-input" placeholder="Type commands or write scripts..." autocomplete="off" autofocus>
            </div>
        </div>

        <!-- Dedicated Application and Editor Window -->
        <div id="app-sandbox" class="app-window">
            <div class="app-header">
                <span id="app-title">IDE Application Workbench</span>
                <span class="close-btn" onclick="closeApp()">[X] EXIT DECK</span>
            </div>
            <div id="app-body"></div>
        </div>
    </div> 

    <script> 
        const logBox = document.getElementById('log-box'); 
        const statusText = document.getElementById('status-text'); 
        const latencyText = document.getElementById('latency-text'); 
        const directoryText = document.getElementById('directory-text'); 
        const promptDisplay = document.getElementById('prompt-display'); 
        const cmdField = document.getElementById('cmd-field');
        const appSandbox = document.getElementById('app-sandbox');
        const appBody = document.getElementById('app-body');
        const appTitle = document.getElementById('app-title');

        // File Storage Engine
        if (!localStorage.getItem('titan_fs')) {
            const initialFS = {
                "root": {
                    "script.js": "return 'Hello from inside your storage disk!';",
                    "readme.txt": "Titan Developer Workspace OS v7.0.\nType 'edit [filename]' to code scripts live."
                }
            };
            localStorage.setItem('titan_fs', JSON.stringify(initialFS));
        }

        let fileSystem = JSON.parse(localStorage.getItem('titan_fs'));
        let currentPath = "root";
        let activeEditingFile = null;

        function saveFS() {
            localStorage.setItem('titan_fs', JSON.stringify(fileSystem));
        }

        function appendLog(message, type) { 
            const logEntry = document.createElement('div'); 
            logEntry.className = type || ''; 
            logEntry.innerHTML = message; 
            logBox.appendChild(logEntry); 
            logBox.scrollTop = logBox.scrollHeight; 
        } 

        function closeApp() {
            appSandbox.style.display = "none";
            appBody.innerHTML = "";
            activeEditingFile = null;
        }

        function saveEditorContent() {
            const txt = document.getElementById('editor-area').value;
            if (activeEditingFile) {
                fileSystem[currentPath][activeEditingFile] = txt;
                saveFS();
                appendLog(`Changes successfully compiled to disk workspace: ${activeEditingFile}`, 'success');
                closeApp();
            }
        }

        // Terminal Prompt Interpreter
        cmdField.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const fullInput = this.value.trim();
                if (!fullInput) return;
                
                appendLog(`[INPUT] user@titan:/${currentPath}$ ${fullInput}`, 'info');
                this.value = ''; 

                const parts = fullInput.split(" ");
                const command = parts[0].toLowerCase();
                const args = parts.slice(1).join(" ");

                switch(command) {
                    case 'help':
                        appendLog("AVAILABLE CODE DECK PIPELINES:\n > ls              - Audit directories\n > edit [filename] - Open IDE terminal code layout\n > cat [filename]  - Stream out file contents\n > run [filename]  - Compile and execute script file code\n > rm [filename]   - Scrub file blocks from memory\n > clear           - Flush workspace terminal logs", "info");
                        break;
                    case 'ls':
                        let targetNode = fileSystem[currentPath];
                        let elements = [];
                        for(let key in targetNode) {
                            elements.push(`<span>${key}</span>`);
                        }
